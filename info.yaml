# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id: "476706846262819841"
  title: "8-bit ripple-carry adder"
  author: "Luis Carlos Meron Jaen"
  discord: "lcmj2803"
  description: "Combinational 8-bit addition of two unsigned operands; low eight result bits on outputs"
  language: "Wokwi"
  clock_hz: 0
  tiles: "1x1"

# Two 8-bit operands mapped across dedicated inputs and bidirectional inputs.
# Final carry is NOT exposed on a pin in this version.
pinout:
  # ui pins
  ui[0]: "U0"
  ui[1]: "U1"
  ui[2]: "U2"
  ui[3]: "U3"
  ui[4]: "U4"
  ui[5]: "U5"
  ui[6]: "U6"
  ui[7]: "U7"

  # uo pins
  uo[0]: "SUM0"
  uo[1]: "SUM1"
  uo[2]: "SUM2"
  uo[3]: "SUM3"
  uo[4]: "SUM4"
  uo[5]: "SUM5"
  uo[6]: "SUM6"
  uo[7]: "SUM7"

  # uio pins
  uio[0]: "V0"
  uio[1]: "V1"
  uio[2]: "V2"
  uio[3]: "V3"
  uio[4]: "V4"
  uio[5]: "V5"
  uio[6]: "V6"
  uio[7]: "V7"

yaml_version: 6
